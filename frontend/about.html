<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About — CuerpoSonoro</title>
  <meta name="description" content="CuerpoSonoro — the body as creator. An artistic and technological project by maramotto.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============================================
       NAVIGATION
       ============================================ -->
  <nav class="nav" id="nav">
    <a href="index.html" class="nav__logo">
      <svg class="nav__logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 22" fill="none"
        stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2,7 Q7,2 12,7 Q17,12 22,7 Q27,2 32,7 Q37,12 42,7"/>
        <path d="M2,15 Q7,10 12,15 Q17,20 22,15 Q27,10 32,15 Q37,20 42,15" opacity="0.45"/>
      </svg>
      CuerpoSonoro
    </a>

    <ul class="nav__links" id="navLinks">
      <li><a href="index.html" data-i18n="nav.demo"></a></li>
      <li><a href="about.html" class="active" data-i18n="nav.about"></a></li>
      <li>
        <div class="lang-toggle">
          <button class="lang-toggle__btn active" data-lang="en">EN</button>
          <button class="lang-toggle__btn" data-lang="es">ES</button>
        </div>
      </li>
    </ul>

    <button class="nav__toggle" id="navToggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </nav>


  <!-- ============================================
       HERO
       ============================================ -->
  <section class="about-hero">
    <div class="about-hero__inner">
      <p class="about-hero__overline" data-i18n="about.hero.overline"></p>
      <h1 class="about-hero__title"  data-i18n="about.hero.title"></h1>
      <p class="about-hero__tagline" data-i18n="about.hero.tagline"></p>
    </div>
  </section>


  <!-- ============================================
       THE PROJECT
       — Everything inside .about-content for consistent column alignment
       ============================================ -->
  <section class="about-section">
    <div class="container">
      <div class="about-content">

        <p class="section-label" data-i18n="about.project.label"></p>
        <h2 class="about-section__title" data-i18n="about.project.title"></h2>

        <p data-i18n-html="about.project.p1"></p>
        <p data-i18n="about.project.p2"></p>
        <p data-i18n="about.project.p3"></p>
        <p data-i18n="about.project.p4"></p>
        <p data-i18n="about.project.p5"></p>

        <blockquote class="pullquote" data-i18n="about.project.pullquote"></blockquote>

        <div class="about-links">
          <a href="https://maramotto.com/cuerposonoro.html" target="_blank" rel="noopener"
            class="btn btn--teal" data-i18n="about.links.web"></a>
          <a href="https://github.com/maramotto/cuerposonoro" target="_blank" rel="noopener"
            class="btn btn--outline-teal" data-i18n="about.links.github"></a>
          <a href="index.html"
            class="btn btn--outline-teal" data-i18n="about.links.demo"></a>
        </div>

      </div>
    </div>
  </section>


  <!-- ============================================
       MARAMOTTO — teal background for strong contrast
       ============================================ -->
  <section class="about-section about-section--mara">
    <div class="container">
      <div class="about-content">

        <p class="section-label about-mara-label" data-i18n="about.mara.label"></p>

        <div class="mara-card">
          <div class="mara-card__avatar">M</div>
          <div class="mara-card__body">
            <p class="mara-card__name" data-i18n="about.mara.name"></p>
            <p class="mara-card__role" data-i18n="about.mara.role"></p>
            <p data-i18n="about.mara.p1"></p>
            <p data-i18n="about.mara.p2"></p>
            <a href="https://maramotto.com" target="_blank" rel="noopener"
              class="mara-link" data-i18n="about.mara.link"></a>
          </div>
        </div>

      </div>
    </div>
  </section>


  <!-- ============================================
       FOOTER — same as maramotto.com
       ============================================ -->
  <footer class="footer">
    <p class="footer__text">
      &copy; 2026 <a href="https://maramotto.com" target="_blank" rel="noopener">maramotto.com</a> &mdash; Made with art and code
    </p>
  </footer>


  <!-- SCRIPTS -->
  <script src="js/i18n.js"></script>

  <script>
    document.getElementById('navToggle').addEventListener('click', () => {
      document.getElementById('navLinks').classList.toggle('open');
    });
  </script>

</body>
</html>
