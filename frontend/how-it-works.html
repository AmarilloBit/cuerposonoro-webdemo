<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How it works — CuerpoSonoro</title>
  <meta name="description" content="CuerpoSonoro — how the system works: computer vision, motion feature extraction and real-time sound synthesis.">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ============================================
       HOW IT WORKS — page-specific styles
       ============================================ */

    /* Pipeline SVG diagram */
    .pipeline-section {
      padding: 5rem 0 4rem;
      background: var(--cream);
    }

    .pipeline-section__header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .pipeline-svg-wrap {
      width: 100%;
      overflow-x: auto;
      padding-bottom: 1rem;
    }

    .pipeline-svg-wrap svg {
      display: block;
      margin: 0 auto;
      max-width: 100%;
    }

    /* Descriptors table section */
    .descriptors-section {
      padding: 5rem 0;
      background: var(--teal);
    }

    .descriptors-section .section-label {
      color: var(--yellow);
      opacity: 0.8;
    }

    .descriptors-section__title {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.8rem, 3.5vw, 2.4rem);
      font-weight: 800;
      color: var(--white);
      letter-spacing: -0.02em;
      margin-top: 0.4rem;
      margin-bottom: 1rem;
    }

    .descriptors-section__intro {
      font-size: 1.05rem;
      line-height: 1.8;
      color: rgba(255, 255, 255, 0.75);
      max-width: 680px;
      margin-bottom: 3rem;
    }

    .descriptors-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    .descriptor-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 1.5rem;
      transition: background 0.2s;
    }

    .descriptor-card:hover {
      background: rgba(255, 255, 255, 0.13);
    }

    .descriptor-card__header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .descriptor-card__icon {
      font-size: 1.3rem;
      flex-shrink: 0;
    }

    .descriptor-card__name {
      font-family: 'Syne', sans-serif;
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--yellow);
    }

    .descriptor-card__body {
      font-size: 0.9rem;
      line-height: 1.65;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 0.75rem;
    }

    .descriptor-card__mapping {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.55);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 0.75rem;
    }

    .descriptor-card__arrow {
      color: var(--yellow);
      flex-shrink: 0;
    }

    /* Stack section */
    .stack-section {
      padding: 5rem 0;
      background: var(--cream);
    }

    .stack-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
      margin-top: 2.5rem;
    }

    .stack-item {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      padding: 1.25rem 1.5rem;
      background: var(--white);
      border-radius: 14px;
      border: 1px solid rgba(30, 107, 123, 0.1);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .stack-item:hover {
      border-color: rgba(30, 107, 123, 0.3);
      box-shadow: 0 4px 16px rgba(30, 107, 123, 0.08);
    }

    .stack-item__layer {
      font-family: 'Syne', sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--teal);
      opacity: 0.7;
    }

    .stack-item__tech {
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 800;
      color: var(--dark);
    }

    .stack-item__desc {
      font-size: 0.82rem;
      color: var(--text-light);
      line-height: 1.5;
    }

    /* Demo vs installation section */
    .compare-section {
      padding: 5rem 0;
      background: var(--cream-dark);
      border-top: 1px solid rgba(30, 107, 123, 0.1);
    }

    .compare-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      margin-top: 2.5rem;
    }

    .compare-card {
      border-radius: 20px;
      padding: 2rem;
    }

    .compare-card--demo {
      background: var(--teal-light);
      border: 1px solid rgba(30, 107, 123, 0.2);
    }

    .compare-card--install {
      background: var(--teal);
      border: 1px solid var(--teal-dark);
    }

    .compare-card__label {
      font-family: 'Syne', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 0.5rem;
    }

    .compare-card--demo .compare-card__label { color: var(--teal); }
    .compare-card--install .compare-card__label { color: var(--yellow); opacity: 0.8; }

    .compare-card__title {
      font-family: 'Syne', sans-serif;
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 1.25rem;
      letter-spacing: -0.01em;
    }

    .compare-card--demo .compare-card__title { color: var(--dark); }
    .compare-card--install .compare-card__title { color: var(--white); }

    .compare-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .compare-list li {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      font-size: 0.9rem;
      line-height: 1.55;
    }

    .compare-card--demo .compare-list li { color: var(--text); }
    .compare-card--install .compare-list li { color: rgba(255,255,255,0.82); }

    .compare-list__dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 0.45rem;
    }

    .compare-card--demo .compare-list__dot { background: var(--teal); }
    .compare-card--install .compare-list__dot { background: var(--yellow); }

    /* GitHub CTA section */
    .github-cta {
      padding: 5rem 0;
      background: var(--dark);
      text-align: center;
    }

    .github-cta__label {
      font-family: 'Syne', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--yellow);
      opacity: 0.7;
      margin-bottom: 1rem;
    }

    .github-cta__heading {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 800;
      color: var(--white);
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }

    .github-cta__text {
      font-size: 1rem;
      color: rgba(255,255,255,0.6);
      line-height: 1.75;
      max-width: 480px;
      margin: 0 auto 2.5rem;
    }

    .github-cta__actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn--github {
      background: var(--yellow);
      color: var(--dark);
      border-color: var(--yellow);
      font-weight: 800;
    }

    .btn--github:hover {
      background: var(--white);
      border-color: var(--white);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .compare-grid {
        grid-template-columns: 1fr;
      }

      .descriptors-grid {
        grid-template-columns: 1fr;
      }

      .stack-grid {
        grid-template-columns: 1fr 1fr;
      }

      .pipeline-section,
      .descriptors-section,
      .stack-section,
      .compare-section {
        padding: 3.5rem 1.5rem;
      }

      .github-cta {
        padding: 3.5rem 1.5rem;
      }
    }

    @media (max-width: 480px) {
      .stack-grid {
        grid-template-columns: 1fr;
      }

      .github-cta__actions {
        flex-direction: column;
        align-items: center;
      }

      .github-cta__actions .btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>

      <div class="pipeline-svg-wrap">
        <svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg"
          width="900" height="320" role="img" aria-label="CuerpoSonoro pipeline diagram">

          <!-- ── background ── -->
          <rect width="900" height="320" fill="#FDF5E6" rx="0"/>

          <!-- ── connector lines ── -->

          <polygon points="468,154 468,166 484,160" fill="#1E6B7B"/>

          <rect x="96" y="122" width="14" height="8" rx="3" fill="#FDF5E6" opacity="0.6"/>
          <!-- label -->

          <!-- ── STEP 2: VISION PROCESSOR ── -->

          <!-- landmark dots -->

          <!-- ── STEP 3: FEATURE EXTRACTION ── -->
          <rect x="468" y="80" width="160" height="160" rx="16" fill="#1E6B7B"/>
          <!-- waveform / signal bars icon -->
          <rect x="496" y="160" width="10" height="26" rx="3" fill="#FFD93D" opacity="0.9"/>
          <rect x="512" y="142" width="10" height="44" rx="3" fill="#FDF5E6"/>

          <!-- ── STEP 4: MAPPING ── -->
