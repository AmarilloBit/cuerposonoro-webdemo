<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How it works — CuerpoSonoro</title>
  <meta name="description" content="CuerpoSonoro — how the system works: computer vision, motion feature extraction and real-time sound synthesis.">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ============================================
       HOW IT WORKS — page-specific styles
       ============================================ */

    /* Pipeline steps: image + text below each box */
    .pipeline-steps {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      max-width: 680px;
      margin: 0 auto;
    }

    .pipeline-step {
      width: 100%;
    }

    .pipeline-step__svg-wrap {
      width: 100%;
    }

    .pipeline-step__svg-wrap svg {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 20px;
    }

    .pipeline-step__text {
      padding: 1.25rem 0.25rem 0;
      margin-bottom: 0.5rem;
    }

    .pipeline-step__number {
      font-family: 'Syne', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--teal);
      opacity: 0.65;
      margin-bottom: 0.2rem;
    }

    .pipeline-step__title {
      font-family: 'Syne', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--dark);
      letter-spacing: -0.01em;
      margin-bottom: 0.4rem;
    }

    .pipeline-step__desc {
      font-size: 0.95rem;
      line-height: 1.7;
      color: var(--text-light);
    }

    .pipeline-arrow {
      display: flex;
      justify-content: center;
      padding: 0.75rem 0;
    }

    .pipeline-arrow svg {
      display: block;
    }

    /* Descriptor cards — 3 visual variants */
    .descriptor-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 1.5rem;
      transition: background 0.2s;
    }

    .descriptor-card:hover {
      background: rgba(255, 255, 255, 0.13);
    }

    /* Variant B: yellow accent background */
    .descriptor-card--yellow {
      background: rgba(255, 217, 61, 0.12);
      border-color: rgba(255, 217, 61, 0.25);
    }

    .descriptor-card--yellow:hover {
      background: rgba(255, 217, 61, 0.18);
    }

    .descriptor-card--yellow .descriptor-card__name {
      color: #FFD93D;
    }

    .descriptor-card--yellow .descriptor-card__body {
      color: rgba(255, 255, 255, 0.85);
    }

    .descriptor-card--yellow .descriptor-card__mapping {
      border-top-color: rgba(255, 217, 61, 0.2);
      color: rgba(255, 255, 255, 0.6);
    }

    /* Variant C: solid white card on teal */
    .descriptor-card--solid {
      background: rgba(255, 255, 255, 0.96);
      border-color: transparent;
    }

    .descriptor-card--solid:hover {
      background: #ffffff;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    }

    .descriptor-card--solid .descriptor-card__name {
      color: var(--teal-dark);
    }

    .descriptor-card--solid .descriptor-card__body {
      color: var(--text);
    }

    .descriptor-card--solid .descriptor-card__mapping {
      border-top-color: rgba(30, 107, 123, 0.12);
      color: var(--text-light);
    }

    .descriptor-card--solid .descriptor-card__arrow {
      color: var(--teal);
    }

    /* Pipeline section */
    .pipeline-section {
      padding: 5rem 0 4rem;
      background: #ffffff;
    }

    .pipeline-section__header {
      text-align: center;
      margin-bottom: 3rem;
    }

    /* Descriptors section */
    .descriptors-section {
      padding: 5rem 0;
      background: var(--teal);
    }

    .descriptors-section .section-label {
      color: var(--yellow);
      opacity: 0.8;
    }

    .descriptors-section__title {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.8rem, 3.5vw, 2.4rem);
      font-weight: 800;
      color: var(--white);
      letter-spacing: -0.02em;
      margin-top: 0.4rem;
      margin-bottom: 1rem;
    }

    .descriptors-section__intro {
      font-size: 1.05rem;
      line-height: 1.8;
      color: rgba(255, 255, 255, 0.75);
      max-width: 680px;
      margin-bottom: 3rem;
    }

    .descriptors-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    .descriptor-card__header {
      margin-bottom: 0.75rem;
    }

    .descriptor-card__name {
      font-family: 'Syne', sans-serif;
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--yellow);
    }

    .descriptor-card__body {
      font-size: 0.9rem;
      line-height: 1.65;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 0.75rem;
    }

    .descriptor-card__mapping {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.55);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 0.75rem;
    }

    .descriptor-card__arrow {
      color: var(--yellow);
      flex-shrink: 0;
    }

    /* Stack section */
    .stack-section {
      padding: 5rem 0;
      background: #ffffff;
    }

    .stack-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
      margin-top: 2.5rem;
    }

    .stack-item {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      padding: 1.25rem 1.5rem;
      background: var(--cream);
      border-radius: 14px;
      border: 1px solid rgba(30, 107, 123, 0.1);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .stack-item:hover {
      border-color: rgba(30, 107, 123, 0.3);
      box-shadow: 0 4px 16px rgba(30, 107, 123, 0.08);
    }

    .stack-item__layer {
      font-family: 'Syne', sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--teal);
      opacity: 0.7;
    }

    .stack-item__tech {
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 800;
      color: var(--dark);
    }

    .stack-item__desc {
      font-size: 0.82rem;
      color: var(--text-light);
      line-height: 1.5;
    }

    /* Demo vs installation section */
    .compare-section {
      padding: 5rem 0;
      background: var(--cream);
      border-top: 1px solid rgba(30, 107, 123, 0.1);
    }

    .compare-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      margin-top: 2.5rem;
    }

    .compare-card {
      border-radius: 20px;
      padding: 2rem;
    }

    .compare-card--demo {
      background: #ffffff;
      border: 1px solid rgba(30, 107, 123, 0.15);
    }

    .compare-card--install {
      background: var(--teal);
      border: 1px solid var(--teal-dark);
    }

    .compare-card__label {
      font-family: 'Syne', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 0.5rem;
    }

    .compare-card--demo .compare-card__label { color: var(--teal); }
    .compare-card--install .compare-card__label { color: var(--yellow); opacity: 0.8; }

    .compare-card__title {
      font-family: 'Syne', sans-serif;
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 1.25rem;
      letter-spacing: -0.01em;
    }

    .compare-card--demo .compare-card__title { color: var(--dark); }
    .compare-card--install .compare-card__title { color: var(--white); }

    .compare-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .compare-list li {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      font-size: 0.9rem;
      line-height: 1.55;
    }

    .compare-card--demo .compare-list li { color: var(--text); }
    .compare-card--install .compare-list li { color: rgba(255,255,255,0.82); }

    .compare-list__dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 0.45rem;
    }

    .compare-card--demo .compare-list__dot { background: var(--teal); }
    .compare-card--install .compare-list__dot { background: var(--yellow); }

    /* GitHub CTA section */
    .github-cta {
      padding: 5rem 0;
      background: var(--dark);
      text-align: center;
    }

    .github-cta__label {
      font-family: 'Syne', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--yellow);
      opacity: 0.7;
      margin-bottom: 1rem;
    }

    .github-cta__heading {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 800;
      color: var(--white);
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }

    .github-cta__text {
      font-size: 1rem;
      color: rgba(255,255,255,0.6);
      line-height: 1.75;
      max-width: 480px;
      margin: 0 auto 2.5rem;
    }

    .github-cta__actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn--github {
      background: var(--white);
      color: var(--dark);
      border-color: var(--white);
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
    }

    .btn--github:hover {
      background: var(--yellow);
      border-color: var(--yellow);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .btn--github svg {
      flex-shrink: 0;
    }

    /* vision_processor bold override in pipeline narrative */
    .vp-bold {
      font-weight: 700;
      color: var(--teal-dark);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .compare-grid {
        grid-template-columns: 1fr;
      }

      .descriptors-grid {
        grid-template-columns: 1fr;
      }

      .stack-grid {
        grid-template-columns: 1fr 1fr;
      }

      .pipeline-section,
      .descriptors-section,
      .stack-section,
      .compare-section {
        padding: 3.5rem 1.5rem;
      }

      .github-cta {
        padding: 3.5rem 1.5rem;
      }
    }

    @media (max-width: 480px) {
      .stack-grid {
        grid-template-columns: 1fr;
      }

      .github-cta__actions {
        flex-direction: column;
        align-items: center;
      }

      .github-cta__actions .btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>

  <!-- ============================================

  <section class="about-hero">
    <div class="about-hero__inner">
      <p class="about-hero__overline" data-i18n="how.hero.overline"></p>
      <h1 class="about-hero__title" data-i18n="how.hero.title"></h1>
      <p class="about-hero__tagline" data-i18n="how.hero.tagline"></p>
    </div>
  </section>


  <!-- ============================================
       PIPELINE DIAGRAM
       ============================================ -->
  <section class="pipeline-section">
    <div class="container">

      <div class="pipeline-section__header">
        <p class="section-label" data-i18n="how.pipeline.label"></p>
        <h2 class="section-title" data-i18n="how.pipeline.title"></h2>
      </div>

      <div class="pipeline-steps">

        <!-- ── STEP 1: CÁMARA ── -->
        <div class="pipeline-step">
          <div class="pipeline-step__svg-wrap">
            <svg viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
              <rect width="680" height="200" rx="20" fill="#1E6B7B"/>
              <circle cx="50" cy="32" r="18" fill="#FFD93D"/>
              <text x="50" y="39" text-anchor="middle" font-family="Syne,sans-serif"
                font-weight="800" font-size="18" fill="#155460">1</text>
              <!-- camera body -->
              <rect x="250" y="52" width="180" height="116" rx="16" fill="none" stroke="#FDF5E6" stroke-width="4"/>
              <!-- lens rings -->
              <circle cx="340" cy="110" r="40" fill="none" stroke="#FDF5E6" stroke-width="4"/>
              <circle cx="340" cy="110" r="22" fill="none" stroke="#FDF5E6" stroke-width="3"/>
              <circle cx="340" cy="110" r="8" fill="#FFD93D"/>
              <!-- viewfinder bump -->
              <rect x="382" y="58" width="34" height="18" rx="6" fill="#FDF5E6" opacity="0.5"/>
              <!-- flash dot -->
              <circle cx="266" cy="72" r="7" fill="#FFD93D" opacity="0.75"/>
            </svg>
          </div>
          <div class="pipeline-step__text">
            <p class="pipeline-step__number" data-i18n="how.step1.number"></p>
            <p class="pipeline-step__title" data-i18n="how.step1.title"></p>
            <p class="pipeline-step__desc" data-i18n="how.step1.desc"></p>
          </div>
        </div>

        <!-- arrow -->
        <div class="pipeline-arrow">
          <svg width="32" height="40" viewBox="0 0 32 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <line x1="16" y1="0" x2="16" y2="28" stroke="#1E6B7B" stroke-width="3" stroke-dasharray="7 4"/>
            <polygon points="4,28 28,28 16,40" fill="#1E6B7B"/>
          </svg>
        </div>

        <!-- ── STEP 2: VISION PROCESSOR ── -->
        <div class="pipeline-step">
          <div class="pipeline-step__svg-wrap">
            <svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
              <rect width="680" height="260" rx="20" fill="#155460"/>
              <circle cx="50" cy="32" r="18" fill="#FFD93D"/>
              <text x="50" y="39" text-anchor="middle" font-family="Syne,sans-serif"
                font-weight="800" font-size="18" fill="#155460">2</text>
              <!-- skeleton: head -->
              <circle cx="340" cy="52" r="26" fill="none" stroke="#FDF5E6" stroke-width="4"/>
              <!-- neck + torso -->
              <line x1="340" y1="78" x2="340" y2="148" stroke="#FDF5E6" stroke-width="4"/>
              <!-- shoulders -->
              <line x1="286" y1="100" x2="394" y2="100" stroke="#FDF5E6" stroke-width="4"/>
              <!-- left arm + forearm -->
              <line x1="286" y1="100" x2="258" y2="148" stroke="#FDF5E6" stroke-width="3.5"/>
              <line x1="258" y1="148" x2="242" y2="186" stroke="#FDF5E6" stroke-width="3"/>
              <!-- right arm + forearm -->
              <line x1="394" y1="100" x2="422" y2="148" stroke="#FDF5E6" stroke-width="3.5"/>
              <line x1="422" y1="148" x2="438" y2="186" stroke="#FDF5E6" stroke-width="3"/>
              <!-- hips -->
              <line x1="310" y1="148" x2="370" y2="148" stroke="#FDF5E6" stroke-width="4"/>
              <!-- left leg + lower leg + foot -->
              <line x1="310" y1="148" x2="290" y2="200" stroke="#FDF5E6" stroke-width="3.5"/>
              <line x1="290" y1="200" x2="278" y2="242" stroke="#FDF5E6" stroke-width="3.5"/>
              <line x1="278" y1="242" x2="256" y2="248" stroke="#FDF5E6" stroke-width="3"/>
              <!-- right leg + lower leg + foot -->
              <line x1="370" y1="148" x2="390" y2="200" stroke="#FDF5E6" stroke-width="3.5"/>
              <line x1="390" y1="200" x2="402" y2="242" stroke="#FDF5E6" stroke-width="3.5"/>
              <line x1="402" y1="242" x2="424" y2="248" stroke="#FDF5E6" stroke-width="3"/>
              <!-- landmark dots (yellow) -->
              <circle cx="340" cy="52" r="6" fill="#FFD93D"/>
              <circle cx="286" cy="100" r="6" fill="#FFD93D"/>
              <circle cx="394" cy="100" r="6" fill="#FFD93D"/>
              <circle cx="258" cy="148" r="6" fill="#FFD93D"/>
              <circle cx="422" cy="148" r="6" fill="#FFD93D"/>
              <circle cx="242" cy="186" r="6" fill="#FFD93D"/>
              <circle cx="438" cy="186" r="6" fill="#FFD93D"/>
              <circle cx="310" cy="148" r="6" fill="#FFD93D"/>
              <circle cx="370" cy="148" r="6" fill="#FFD93D"/>
              <circle cx="290" cy="200" r="6" fill="#FFD93D"/>
              <circle cx="390" cy="200" r="6" fill="#FFD93D"/>
              <circle cx="278" cy="242" r="6" fill="#FFD93D"/>
              <circle cx="402" cy="242" r="6" fill="#FFD93D"/>
            </svg>
          </div>
          <div class="pipeline-step__text">
            <p class="pipeline-step__number" data-i18n="how.step2.number"></p>
            <p class="pipeline-step__title" data-i18n="how.step2.title"></p>
            <p class="pipeline-step__desc" data-i18n="how.step2.desc"></p>
          </div>
        </div>

        <!-- arrow -->
        <div class="pipeline-arrow">
          <svg width="32" height="40" viewBox="0 0 32 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <line x1="16" y1="0" x2="16" y2="28" stroke="#1E6B7B" stroke-width="3" stroke-dasharray="7 4"/>
            <polygon points="4,28 28,28 16,40" fill="#1E6B7B"/>
          </svg>
        </div>

        <!-- ── STEP 3: FEATURE EXTRACTION ── -->
        <div class="pipeline-step">
          <div class="pipeline-step__svg-wrap">
            <svg viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
              <rect width="680" height="200" rx="20" fill="#1E6B7B"/>
              <circle cx="50" cy="32" r="18" fill="#FFD93D"/>
              <text x="50" y="39" text-anchor="middle" font-family="Syne,sans-serif"
                font-weight="800" font-size="18" fill="#155460">3</text>
              <!-- bar chart -->
              <rect x="218" y="96" width="34" height="72" rx="6" fill="#FFD93D" opacity="0.85"/>
              <rect x="262" y="64" width="34" height="104" rx="6" fill="#FDF5E6"/>
              <rect x="306" y="78" width="34" height="90" rx="6" fill="#FFD93D" opacity="0.7"/>
              <rect x="350" y="44" width="34" height="124" rx="6" fill="#FDF5E6"/>
              <rect x="394" y="82" width="34" height="86" rx="6" fill="#FFD93D" opacity="0.8"/>
              <rect x="438" y="106" width="34" height="62" rx="6" fill="#FDF5E6" opacity="0.6"/>
              <!-- baseline -->
              <line x1="210" y1="172" x2="480" y2="172" stroke="rgba(253,245,230,0.25)" stroke-width="2"/>
            </svg>
          </div>
          <div class="pipeline-step__text">
            <p class="pipeline-step__number" data-i18n="how.step3.number"></p>
            <p class="pipeline-step__title" data-i18n="how.step3.title"></p>
            <p class="pipeline-step__desc" data-i18n="how.step3.desc"></p>
          </div>
        </div>

        <!-- arrow -->
        <div class="pipeline-arrow">
          <svg width="32" height="40" viewBox="0 0 32 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <line x1="16" y1="0" x2="16" y2="28" stroke="#1E6B7B" stroke-width="3" stroke-dasharray="7 4"/>
            <polygon points="4,28 28,28 16,40" fill="#1E6B7B"/>
          </svg>
        </div>

        <!-- ── STEP 4: MAPPING ── -->
        <div class="pipeline-step">
          <div class="pipeline-step__svg-wrap">
            <svg viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
              <rect width="680" height="240" rx="20" fill="#155460"/>
              <circle cx="50" cy="32" r="18" fill="#FFD93D"/>
              <text x="50" y="39" text-anchor="middle" font-family="Syne,sans-serif"
                font-weight="800" font-size="18" fill="#155460">4</text>
              <!-- left col: feature dots -->
              <circle cx="185" cy="76" r="8" fill="rgba(255,255,255,0.3)"/>
              <circle cx="185" cy="112" r="8" fill="rgba(255,255,255,0.3)"/>
              <circle cx="185" cy="148" r="8" fill="rgba(255,255,255,0.3)"/>
              <circle cx="185" cy="184" r="8" fill="rgba(255,255,255,0.3)"/>
              <!-- connector lines with arrows to right col -->
              <line x1="200" y1="76" x2="460" y2="76" stroke="#FFD93D" stroke-width="2.5" stroke-dasharray="8 5"/>
