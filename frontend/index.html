  <!-- ============================================
       HERO
       ============================================ -->
  <section class="hero" id="hero">

    <!-- Inline SVG — cream stroke, visible on teal bg -->
    <svg class="hero__visual" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none"
      stroke="#FDF5E6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="200" cy="90" r="30"/>
      <line x1="200" y1="120" x2="200" y2="140"/>
      <path d="M160,148 Q160,140 200,138 Q240,140 240,148 L235,245 Q235,252 200,252 Q165,252 165,245 Z"/>
      <path d="M160,158 Q130,148 100,155 Q80,160 65,150"/>
      <path d="M65,150 Q58,146 55,150" stroke-width="3.5"/>

      <path d="M218,62 Q225,42 218,22" stroke-width="3" opacity="0.45"/>

      <circle cx="280" cy="120" r="3" fill="#FDF5E6" stroke="none" opacity="0.5"/>
      <circle cx="95" cy="210" r="2.5" fill="#FDF5E6" stroke="none" opacity="0.4"/>
      <circle cx="305" cy="210" r="2.5" fill="#FDF5E6" stroke="none" opacity="0.4"/>

    <p class="hero__overline" data-i18n="hero.overline"></p>

    <!-- Claim block: both lines grouped, separated from description -->
    <div class="hero__claim">
      <h1 class="hero__title"     data-i18n="hero.title"></h1>
      <p  class="hero__title-sub" data-i18n="hero.title.sub"></p>
    </div>

    <p class="hero__description" data-i18n="hero.description"></p>

    <div class="hero__cta">
      <a href="#demo" class="btn btn--yellow"          data-i18n="hero.cta.try"></a>
      <a href="about.html" class="btn btn--outline-white" data-i18n="hero.cta.about"></a>
    </div>
  </section>


  <!-- ============================================
       DEMO + FEATURES — one continuous section
       ============================================ -->
  <section class="demo-section" id="demo">
    <div class="container">

      <div class="demo-section__header">
        <p class="section-label" data-i18n="demo.label"></p>
        <h2 class="section-title" data-i18n="demo.title"></h2>
      </div>

      <div class="demo-stage">

        <div class="video-wrap">
          <video id="video" autoplay playsinline></video>
          <canvas id="canvas"></canvas>
          <span id="status" class="status-badge" data-i18n="demo.status.loading"></span>
        </div>

        <div class="demo-sidebar">

          <div class="demo-controls">
            <button id="startBtn" class="btn btn--teal"         disabled data-i18n="demo.btn.start"></button>
            <button id="stopBtn"  class="btn btn--outline-teal" disabled data-i18n="demo.btn.stop"></button>
          </div>

          <div class="features-panel">
            <p class="features-panel__title" data-i18n="demo.panel.title"></p>

            <div class="feature-row">
              <span class="feature-row__label" data-i18n="feature.energy"></span>
              <div class="bar-track"><div id="bar-energy" class="bar-fill"></div></div>
              <span id="val-energy" class="feature-row__value">0.00</span>
            </div>
            <div class="feature-row">
              <span class="feature-row__label" data-i18n="feature.symmetry"></span>
              <div class="bar-track symmetry"><div id="bar-symmetry" class="bar-fill symmetry"></div></div>
              <span id="val-symmetry" class="feature-row__value">0.00</span>
            </div>
            <div class="feature-row">
              <span class="feature-row__label" data-i18n="feature.smoothness"></span>
              <div class="bar-track"><div id="bar-smoothness" class="bar-fill"></div></div>
              <span id="val-smoothness" class="feature-row__value">0.00</span>
            </div>
            <div class="feature-row">
              <span class="feature-row__label" data-i18n="feature.arms"></span>
              <div class="bar-track"><div id="bar-armAngle" class="bar-fill"></div></div>
              <span id="val-armAngle" class="feature-row__value">0.00</span>
            </div>

          </div>

          <div class="ws-status">
            <span id="wsIndicator" class="ws-dot"></span>
            <span id="wsText" data-i18n="demo.ws.disconnected"></span>
          </div>

        </div>
      </div><!-- /demo-stage -->


      <!-- Bridge -->
      <div class="demo-bridge">
        <div class="demo-bridge__line"></div>
        <p class="demo-bridge__text" data-i18n="demo.bridge"></p>
        <div class="demo-bridge__line"></div>
      </div>


      <!-- Features — single-column list -->
      <div class="features-list">

        <div class="fitem">
          <div class="fitem__left">
            <span class="fitem__icon">⚡</span>
            <div class="fitem__id">
              <p class="fitem__name"    data-i18n="card.energy.name"></p>
              <p class="fitem__measure" data-i18n="card.energy.measure"></p>
            </div>
          </div>
          <div class="fitem__right">
            <p class="fitem__desc" data-i18n="card.energy.desc"></p>
            <p class="fitem__effect">
              <span class="fitem__arrow">→</span>
              <span data-i18n="card.energy.effect"></span>
            </p>
          </div>
        </div>

        <div class="fitem">
          <div class="fitem__left">
            <span class="fitem__icon">⚖️</span>
            <div class="fitem__id">
              <p class="fitem__name"    data-i18n="card.symmetry.name"></p>
              <p class="fitem__measure" data-i18n="card.symmetry.measure"></p>
            </div>
          </div>
          <div class="fitem__right">
            <p class="fitem__desc" data-i18n="card.symmetry.desc"></p>
            <p class="fitem__effect">
              <span class="fitem__arrow">→</span>
              <span data-i18n="card.symmetry.effect"></span>
            </p>
          </div>
        </div>

        <div class="fitem">
          <div class="fitem__left">
            <span class="fitem__icon">〰️</span>
            <div class="fitem__id">
              <p class="fitem__name"    data-i18n="card.smoothness.name"></p>
              <p class="fitem__measure" data-i18n="card.smoothness.measure"></p>
            </div>
          </div>
          <div class="fitem__right">
            <p class="fitem__desc" data-i18n="card.smoothness.desc"></p>
            <p class="fitem__effect">
              <span class="fitem__arrow">→</span>
              <span data-i18n="card.smoothness.effect"></span>
            </p>
          </div>
        </div>

        <div class="fitem">
          <div class="fitem__left">
            <span class="fitem__icon">🙆</span>
            <div class="fitem__id">
              <p class="fitem__name"    data-i18n="card.arms.name"></p>
              <p class="fitem__measure" data-i18n="card.arms.measure"></p>
            </div>
          </div>
          <div class="fitem__right">
            <p class="fitem__desc" data-i18n="card.arms.desc"></p>
            <p class="fitem__effect">
              <span class="fitem__arrow">→</span>
              <span data-i18n="card.arms.effect"></span>
            </p>
          </div>
        </div>

        <div class="fitem">
          <div class="fitem__left">
            <span class="fitem__icon">🙌</span>
            <div class="fitem__id">
              <p class="fitem__name"    data-i18n="card.vertical.name"></p>
              <p class="fitem__measure" data-i18n="card.vertical.measure"></p>
            </div>
          </div>
          <div class="fitem__right">
            <p class="fitem__desc" data-i18n="card.vertical.desc"></p>
            <p class="fitem__effect">
              <span class="fitem__arrow">→</span>
              <span data-i18n="card.vertical.effect"></span>
            </p>
          </div>
        </div>

      </div><!-- /features-list -->

    </div>
  </section>
